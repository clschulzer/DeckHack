<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Second line of defence behind the sandboxed preview. The preview iframe inherits this policy,
      so neither the app nor deck code can send data (for example an API key) anywhere except the
      services DeckHack talks to. Scripts and styles stay open because decks bring their own.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob: data:; style-src 'self' 'unsafe-inline' https:; img-src * data: blob:; media-src * data: blob:; font-src * data:; connect-src 'self' https://api.anthropic.com https://api.github.com https://cdn.jsdelivr.net data: blob:; frame-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>DeckHack</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2219%22 fill=%22%23173e3b%22/%3E%3Cpath d=%22M31 51c5-11 8-21 6-32%22 fill=%22none%22 stroke=%22%23ef936f%22 stroke-width=%225%22 stroke-linecap=%22round%22/%3E%3Cg fill=%22%23f5f1e8%22%3E%3Cpath d=%22M36 23C23 9 12 18 10 31c10-8 17-10 26-8Z%22/%3E%3Cpath d=%22M36 23C36 9 49 7 57 16c-10 0-17 3-21 7Z%22/%3E%3Cpath d=%22M36 23C23 0 15 9 16 15c9 0 15 4 20 8Z%22/%3E%3Cpath d=%22M36 23C48 16 56 26 55 37c-7-8-12-11-19-14Z%22/%3E%3C/g%3E%3C/svg%3E%0A" />
  </head>

  </body>
</html>
